
services:

  spark-master:
    image: apache/spark:4.3.0-scala2.13-java21-python3-ubuntu
    container_name: spark-master
    hostname: spark-master
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - spark-network
    restart: unless-stopped

  spark-worker-1:
    image: apache/spark:4.3.0-scala2.13-java21-python3-ubuntu
    container_name: spark-worker-1
    hostname: spark-worker-1
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 3G
      - --webui-port
      - "8081"
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    networks:
      - spark-network
    restart: unless-stopped

  spark-worker-2:
    image: apache/spark:4.3.0-scala2.13-java21-python3-ubuntu
    container_name: spark-worker-2
    hostname: spark-worker-2
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "1"
      - --memory
      - 3G
      - --webui-port
      - "8081"
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
    networks:
      - spark-network
    restart: unless-stopped


  spark-notebook:
    image: quay.io/jupyter/pyspark-notebook:latest
    container_name: spark-notebook
    hostname: spark-notebook
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      JUPYTER_ENABLE_LAB: "yes"
    networks:
      - spark-network
    depends_on:
      - spark-master
    command: start-notebook.py --ServerApp.ip=0.0.0.0


networks:
  spark-network:
    driver: bridge
